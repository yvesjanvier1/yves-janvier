[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback: let React Router handle deep links / refreshes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deploy Previews: one preview URL per pull request
[context.deploy-preview]
  command = "npm run build"

[context.deploy-preview.environment]
  NODE_VERSION = "20"
  VITE_APP_ENV = "preview"

# Branch deploys: every branch pushed gets its own preview URL
# (enable "Branch deploys: All" in Netlify > Site configuration > Build & deploy)
[context.branch-deploy]
  command = "npm run build"

[context.branch-deploy.environment]
  NODE_VERSION = "20"
  VITE_APP_ENV = "preview"

[context.production.environment]
  NODE_VERSION = "20"
  VITE_APP_ENV = "production"

